version: '3.8'

services:
  web:
    build:
      context: ./CabTap
      dockerfile: CabTap.Web/Dockerfile
    container_name: cabtap-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CabTapDBPassword=277353
      - ConnectionStrings__PostgresConnection=Host=postgres;Port=5432;Database=CabTapDB;Username=postgres;Password=${CabTapDBPassword};
    ports:
      - "5000:80"
    depends_on:
      - postgres
    networks:
      - cabtap-network

  postgres:
    image: postgis/postgis:17-3.5
    container_name: cabtap-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=277353
      - POSTGRES_DB=CabTapDB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cabtap-network

networks:
  cabtap-network:
    driver: bridge

volumes:
  postgres-data:
