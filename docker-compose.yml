version: '3.8'

services:
  web:
    build:
      context: ./CabTap
      dockerfile: CabTap.Web/Dockerfile
    container_name: cabtap-web
    env_file:
      - .env
    ports:
      - "5000:80"
    depends_on:
      - postgres
    networks:
      - cabtap-network

  postgres:
    image: postgis/postgis:17-3.5
    container_name: cabtap-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${CabTapDBPassword}
      - POSTGRES_DB=CabTapDB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cabtap-network
    ports:
      - "5433:5432"

networks:
  cabtap-network:
    driver: bridge

volumes:
  postgres-data:
